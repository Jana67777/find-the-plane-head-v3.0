<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>寻机头小游戏</title>
    <!-- PWA -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="寻机头">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">

    <!-- 本地“服务端”：Service Worker 拦截 ./api/game/* ，棋盘只存在于 SW 内部，页面读不到机头 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js')
            .then(function (reg) { console.log('[SW] 已注册，作用域:', reg.scope); })
            .catch(function (e) { console.warn('[SW] 注册失败（游戏会退回客户端生成）:', e); });
        });
      }
    </script>

    <script type="module" crossorigin src="./assets/index-yrhRD31a.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-VLUspUbY.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="global-error" style="position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.9);color:white;padding:20px;display:none;z-index:99999;white-space:pre-wrap;font-family:monospace;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.getElementById('global-error');
        div.style.display = 'block';
        div.innerHTML += 'Error: ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error ? error.stack : '') + '\n\n';
      };
      window.onunhandledrejection = function(e) {
        var div = document.getElementById('global-error');
        div.style.display = 'block';
        div.innerHTML += 'Promise Error: ' + e.reason + '\n\n';
      };
    </script>
  </body>
</html>
